<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contacto — Anik Jiménez Marulanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<nav class="top" id="nav">
  <div class="row">
    <a class="brandmark" href="index.html">Anik <span>Jiménez Marulanda</span></a>
    <div class="nav-links">
      <a href="sobre.html">Sobre Anik</a>
      <a href="libros.html">Mis libros</a>
      <a href="palabra.html">Una palabra</a>
      <a href="contacto.html" class="active">Contacto</a>
    </div>
  </div>
</nav>

<main>
  <section class="page" data-screen-label="05 Contacto">
    <div class="wrap">
      <div class="section-head">
        <span class="section-num">iii.</span>
        <h2 class="section-title">Hablemos<span class="em">.</span></h2>
      </div>

      <div class="contact-grid">
        <div class="contact-intro">
          <p>Si mi historia resonó contigo, me encantaría saber.</p>
          <div class="email">Escríbeme a <a href="mailto:hola@anikjimenez.com">hola@anikjimenez.com</a></div>
        </div>

        <form class="contact" onsubmit="event.preventDefault(); alert('Gracias. Te leeré con cariño.');">
          <div class="field">
            <label for="email">Tu correo</label>
            <input id="email" type="email" placeholder="nombre@correo.com" required />
          </div>
          <div class="field">
            <label for="msg">Tu mensaje</label>
            <textarea id="msg" placeholder="Cuéntame lo que quieras compartir…" required></textarea>
          </div>
          <div class="submit-row">
            <button type="submit" class="btn">Enviar mensaje <span class="arrow">→</span></button>
          </div>
        </form>
      </div>
    </div>

    <div class="page-nav">
      <div class="page-nav-row">
        <a href="palabra.html">
          <span class="step">← Anterior</span>
          <span class="label">Una palabra</span>
        </a>
        <a href="index.html" class="next">
          <span class="step">Volver al →</span>
          <span class="label">Inicio</span>
        </a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="foot-row">
      <div class="mark">Anik Jiménez Marulanda</div>
      <div>© 2026 · Hecho con calma desde Colombia</div>
    </div>
  </div>
</footer>

<script>
  const nav = document.getElementById('nav');
  const onScroll = () => {
    if (window.scrollY > 16) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>
</body>
</html>
