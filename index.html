<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anik Jiménez Marulanda — Escritora</title>
  <meta name="description" content="Escritora colombiana. Historias de fe, resiliencia y esperanza desde Bogotá." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html"><img src="images/logo-anik.png" alt="Anik Jiménez" width="200" height="74" /></a>
      <div class="menu">
        <a href="sobre.html">Sobre Anik</a>
        <a href="libros.html">Mis libros</a>
        <a href="palabra.html">Una palabra</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </div>
  </nav>

  <main>
    <header class="hero" data-screen-label="01 Portada">
      <div class="triangles" aria-hidden="true">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
          <g fill="none" stroke="#38a7de" stroke-width="1.2" opacity=".7">
            <path d="M60 160 L190 50 L250 260 Z" fill="rgba(183,205,230,.35)" />
            <path d="M110 620 L250 500 L310 740 Z" fill="rgba(56,167,222,.12)" />
            <path d="M1120 180 L1240 70 L1320 260 Z" fill="rgba(183,205,230,.28)" />
            <path d="M1040 680 L1200 520 L1300 820 Z" fill="rgba(0,105,149,.18)" />
            <path d="M960 760 L1110 620 L1180 860 Z" fill="rgba(182,138,102,.25)" />
            <path d="M880 820 L980 740 L1020 900 Z" fill="rgba(15,205,182,.18)" />
          </g>
        </svg>
      </div>
      <div class="hero-content">
        <div class="hero-kicker">Escritora · Bogotá</div>
        <h1 class="hero-logo">
          <img src="images/logo-anik.png" alt="Anik Jiménez" width="520" height="192" />
        </h1>
        <p class="hero-tag">Historias que acompañan el caminar: fe, resiliencia y sentido ante la existencia.</p>
        <div class="hero-actions">
          <a class="btn" href="libros.html">Conoce mis libros <span>→</span></a>
          <a class="btn btn-ghost" href="sobre.html">Sobre mí</a>
        </div>
      </div>
    </header>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="mark"><img src="images/logo-anik.png" alt="Anik Jiménez" width="160" height="59" /></div>
      <div>© 2026 · Bogotá, Colombia</div>
    </div>
  </footer>

  <script>
    const nav = document.getElementById('nav');
    const onScroll = () => nav.classList.toggle('is-scrolled', window.scrollY > 12);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
